<meta name="robots" content="noindex, nofollow">

<!-- Overrides for Storybook Docs and UI. -->
<link href="storybook-overrides.css" rel="stylesheet" />

<!-- Baseline Status -->
<script src="https://cdn.jsdelivr.net/npm/baseline-status@1/baseline-status.min.js" type="module"></script>

<!-- Load CSS/JS that Parcel has bundled... these are set programmatically in 'main.js'. -->
<script>
    const link = document.createElement('link');
    const script = document.createElement('script');

    const cssPath = window.location.hostname === 'localhost'
        ? 'index.css'
        : 'build/ui/default/css/index.css';
    const jsPath = window.location.hostname === 'localhost'
        ? 'index.js'
        : 'build/ui/default/javascript/index.js';

    link.rel = 'stylesheet';
    link.href = cssPath;
    document.head.appendChild(link);

    script.defer = true;
    script.type = 'module';
    script.src = jsPath;
    document.head.appendChild(script);
</script>
